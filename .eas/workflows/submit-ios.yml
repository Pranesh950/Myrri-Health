name: Submit iOS to TestFlight
# Builds production iOS and auto-submits to TestFlight on every push to main.
# Per https://docs.expo.dev/submit/ios/ — requires App Store Connect API Key (EAS env: EXPO_ASC_*)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build iOS app
    type: build
    params:
      platform: ios
      profile: production
      env:
        EXPO_NO_CAPABILITY_SYNC: "1"

  submit_ios:
    name: Submit to TestFlight
    needs: [build_ios]
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
